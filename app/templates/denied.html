{% extends "base.html" %}
{% block title %}{{ stamp }}{% endblock %}
{% block content %}
<section class="denied">
  <div class="stamp stamp-big">{{ stamp }}</div>
  <h1>{{ heading }}</h1>
  <p class="lede">{{ message }}</p>
  <p class="muted mono">Ref: BRT/{{ range(1000, 9999) | random }}/EYES-ONLY</p>
</section>
{% endblock %}
